name: Impacted E2E UI Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['CHANGELOG.md']
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: impacted-e2e-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OMNIGENT_SKIP_WEB_UI: "true"
  ANTHROPIC_API_KEY: ""
  DATABRICKS_TOKEN: ""
  CODEX: ""
  CLAUDE_CODE: ""
  UV_INDEX_URL: https://pypi.org/simple
  TERM: xterm-256color

jobs:
  gate:
    uses: ./.github/workflows/security-gate.yml

  build-sidecar:
    name: build codex-parity sidecar
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - name: Capture Rust version
        id: rustc
        run: echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache parity sidecar binary
        id: sidecar-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v4
        with:
          path: .tmp-codex-parity-target/debug/codex-parity-sidecar
          key: codex-parity-bin-${{ runner.os }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('tests/codex_parity/sidecar/**') }}
      - name: Build parity sidecar
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: cargo build --manifest-path tests/codex_parity/sidecar/Cargo.toml --target-dir .tmp-codex-parity-target
      - name: Upload sidecar binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: impacted-e2e-codex-parity-sidecar
          path: .tmp-codex-parity-target/debug/codex-parity-sidecar
          if-no-files-found: error
          retention-days: 1

  impacted-e2e:
    name: Impacted E2E UI (nonblocking)
    needs: [gate, build-sidecar]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - name: Record lane start
        run: echo "IMPACTED_E2E_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: ".python-version"
      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - name: Cache virtualenv
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('.python-version') }}-${{ hashFiles('uv.lock') }}
      - name: Install project + test dependencies
        run: uv sync --locked --extra all --group test

      - name: Compute changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -n "$BASE_SHA" ]]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/impacted-e2e-changed-files.txt
          else
            git diff --name-only "${HEAD_SHA}^" "$HEAD_SHA" > /tmp/impacted-e2e-changed-files.txt
          fi
          echo "Changed files: $(wc -l < /tmp/impacted-e2e-changed-files.txt)"

      - name: Download latest successful main coverage index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/impacted-e2e-index
          run_id="$({ gh api --paginate -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/e2e-ui.yml/runs?branch=main&status=success&per_page=100" \
            --jq '.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch") | .id'; } | head -n 1)"
          if [[ -z "$run_id" ]]; then
            echo "::notice::No successful main E2E UI run has published a coverage index yet."
            exit 0
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name e2e-ui-coverage-index --dir /tmp/impacted-e2e-index \
            || echo "::notice::Run $run_id has no usable coverage-index artifact."

      - name: Select impacted tests
        id: selection
        run: |
          index_path="$(find /tmp/impacted-e2e-index -name e2e-ui-coverage-index.json -print -quit)"
          index_path="${index_path:-/tmp/impacted-e2e-index/e2e-ui-coverage-index.json}"
          if [[ -f .github/scripts/ci/select-impacted-e2e.py ]]; then
            uv run --no-sync python .github/scripts/ci/select-impacted-e2e.py \
              --index "$index_path" \
              --changed-files /tmp/impacted-e2e-changed-files.txt \
              --output /tmp/impacted-e2e-selection.json
          else
            echo '{"mode":"full","confidence":"none","reasons":["selector-unavailable"],"selected_node_ids":[],"selected_count":0,"full_count":0}' > /tmp/impacted-e2e-selection.json
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path('/tmp/impacted-e2e-selection.json').read_text())
          node_ids = result.get('selected_node_ids', [])
          Path('/tmp/impacted-e2e-nodeids.txt').write_text('\n'.join(node_ids) + ('\n' if node_ids else ''))
          reason = ', '.join(result.get('reasons', [])) or 'none'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"mode={result.get('mode', 'full')}\n")
              output.write(f"confidence={result.get('confidence', 'none')}\n")
              output.write(f"reason={reason}\n")
              output.write(f"selected_count={result.get('selected_count', len(node_ids))}\n")
              output.write(f"full_count={result.get('full_count', 0)}\n")
          PY

      - name: Install browser test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap tmux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          uv run playwright install --with-deps chromium
      - name: Download codex-parity sidecar binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: impacted-e2e-codex-parity-sidecar
          path: .tmp-codex-parity-target/debug
      - name: Make sidecar binary executable
        run: chmod +x .tmp-codex-parity-target/debug/codex-parity-sidecar
      - name: Build web SPA
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          pnpm install --frozen-lockfile --filter web
          pnpm --filter web run build
      - name: Install native harness CLIs
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          cc_dir="${RUNNER_TEMP}/omnigent-cc-cli"
          mkdir -p "$cc_dir" && cd "$cc_dir"
          npm install --no-audit --no-fund @anthropic-ai/claude-code@2.1.236
          echo "$cc_dir/node_modules/.bin" >> "$GITHUB_PATH"
          codex_dir="${RUNNER_TEMP}/omnigent-codex-cli"
          mkdir -p "$codex_dir" && cd "$codex_dir"
          npm install --ignore-scripts --no-audit --no-fund @openai/codex@0.139.0
          echo "$codex_dir/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run impacted UI E2E tests
        env:
          CODEX_PARITY_SIDECAR_BIN: ${{ github.workspace }}/.tmp-codex-parity-target/debug/codex-parity-sidecar
          SELECTION_MODE: ${{ steps.selection.outputs.mode }}
        run: |
          test_targets=(tests/e2e_ui)
          if [[ "$SELECTION_MODE" == "selected" ]]; then
            mapfile -t test_targets < /tmp/impacted-e2e-nodeids.txt
          fi
          uv run pytest "${test_targets[@]}" \
            -v --tb=long --showlocals --log-level=INFO -r a \
            --durations=25 --durations-min=1.0 \
            --reruns=1 --reruns-delay=5 \
            --ui-skip-build \
            --tracing=retain-on-failure \
            --screenshot=only-on-failure \
            --video=retain-on-failure \
            --junitxml=/tmp/impacted-e2e-junit.xml \
            -m "not visual and not nightly"

      - name: Publish impacted-lane summary
        if: always()
        env:
          MODE: ${{ steps.selection.outputs.mode }}
          CONFIDENCE: ${{ steps.selection.outputs.confidence }}
          REASON: ${{ steps.selection.outputs.reason }}
          SELECTED_COUNT: ${{ steps.selection.outputs.selected_count }}
          FULL_COUNT: ${{ steps.selection.outputs.full_count }}
        run: |
          elapsed="$(( $(date -u +%s) - IMPACTED_E2E_STARTED_AT ))"
          {
            echo "## Impacted E2E signal"
            echo
            echo "- Mode: \`${MODE:-full}\`"
            echo "- Confidence: \`${CONFIDENCE:-none}\`"
            echo "- Fallback/selection reasons: ${REASON:-selection step did not complete}"
            echo "- Selected tests: ${SELECTED_COUNT:-unknown} / ${FULL_COUNT:-unknown}"
            echo "- Time to first E2E signal: ${elapsed}s"
            echo "- Merge gating: nonblocking; the five authoritative E2E UI shards remain unchanged"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload impacted-lane diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: impacted-e2e-ui-${{ github.run_id }}
          path: |
            /tmp/impacted-e2e-selection.json
            /tmp/impacted-e2e-changed-files.txt
            /tmp/impacted-e2e-junit.xml
            test-results/
          retention-days: 3
          if-no-files-found: ignore
